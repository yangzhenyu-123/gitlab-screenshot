[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlabshot"
version = "0.1.0"
description = "GitLab 仓库审计逐屏截图转 Word 工具（内网友好）"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "python-docx>=1.0",
    "Pillow>=10.0",
    "requests>=2.28",
]

[project.scripts]
gitlabshot = "gitlabshot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitlabshot*"]
