[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlabshot"
version = "0.1.0"
description = "GitLab 仓库审计逐屏截图工具（内网友好，直接保存 PNG 文件）"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40",
    "requests>=2.28",
    "PyYAML>=6.0",
]

[project.scripts]
gitlabshot = "gitlabshot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitlabshot*"]
